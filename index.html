<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王奕晨 · 个人主页</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE; --ink:#1C1A16; --muted:#7A7368;
    --accent:#C63A1D; --line:#DDD6C9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans SC",sans-serif;
    line-height:1.8; font-size:16px;
  }
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}

  /* 顶栏 */
  header{padding:28px 0;border-bottom:1px solid var(--line)}
  header .wrap{display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:"Fraunces",serif;font-weight:900;font-size:1.1rem}
  .logo i{color:var(--accent);font-style:normal}
  nav{display:flex;gap:20px;font-size:.85rem}
  nav a{position:relative;color:var(--muted);transition:color .25s}
  nav a:hover{color:var(--ink)}
  nav a::after{
    content:"";position:absolute;left:0;bottom:-3px;width:100%;height:1px;
    background:var(--accent);transform:scaleX(0);transform-origin:right;
    transition:transform .3s ease;
  }
  nav a:hover::after{transform:scaleX(1);transform-origin:left}

  /* 开场 */
  .hero{padding:110px 0 90px;animation:fadeUp .8s ease both}
  .hero .hi{color:var(--accent);font-size:.85rem;letter-spacing:.2em;margin-bottom:18px}
  .hero h1{font-family:"Fraunces","Noto Sans SC",serif;font-weight:900;font-size:clamp(2.6rem,8vw,4.2rem);line-height:1.15}
  .hero h1 em{font-style:italic;color:var(--accent)}
  .hero p{margin-top:22px;color:var(--muted);max-width:32em}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  /* 区块 */
  section{padding:70px 0;border-top:1px solid var(--line)}
  h2{font-family:"Fraunces","Noto Sans SC",serif;font-weight:900;font-size:1.5rem;margin-bottom:28px}
  h2 span{color:var(--accent);font-size:.75rem;vertical-align:middle;margin-right:10px;letter-spacing:.15em}
  .about p{color:#3d3830;margin-bottom:14px}

  /* 联系 */
  .contact .mail{
    display:inline-block;font-family:"Fraunces",serif;font-weight:600;
    font-size:clamp(1.3rem,4.5vw,2rem);
    border-bottom:2px solid var(--ink);padding-bottom:4px;
    transition:color .25s,border-color .25s;
  }
  .contact .mail:hover{color:var(--accent);border-color:var(--accent)}
  .socials{margin-top:30px;display:flex;gap:22px;font-size:.85rem}
  .socials a{color:var(--muted);transition:color .25s}
  .socials a:hover{color:var(--accent)}

  footer{padding:30px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
  footer .wrap{display:flex;justify-content:space-between}

  @media(max-width:560px){
    nav{gap:14px}
    .hero{padding:70px 0 60px}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top">王奕晨<i>.</i></a>
    <nav>
      <a href="#about">关于</a>
      <a href="#contact">联系</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap">

    <div class="hero">
      <p class="hi">你好,我是</p>
      <h1>王奕晨,<br>一名<em>高中生</em>。<br>就读于江西省南康中学。</h1>
      <p>我是一个热爱学习和探索的高中生，对技术和设计充满热情。</p>
    </div>

    <section class="about" id="about">
      <h2><span>01</span>关于我</h2>
      <p>我喜欢在技术和设计的世界中不断探索和学习。无论是编写代码还是设计界面，我都乐于挑战自我，追求卓越。我相信通过不断的努力和实践，我能够在未来的道路上取得更大的成就。
      </p>
      <p>常用技术:HTML,c++</p>
    </section>

    <section class="contact" id="contact">
      <h2><span>02</span>联系我</h2>
      <p style="color:var(--muted);margin-bottom:24px">也许只是打个招呼 ——</p>
      <a class="mail" href="mailto:393181509@qq.com">393181509@qq.com</a>
      <div class="socials">
        <a href="https://github.com/wangyichen2026">GitHub ↗</a>
        <a href="https://space.bilibili.com/1454461780">Bilibili ↗</a>
      </div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 王奕晨</span>
    <span>江西南康</span>
  </div>
</footer>

</body>
</html>
